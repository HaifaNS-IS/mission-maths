<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : coque plein cadre en colonne. Barre de navigation fixe en haut, puis l'écran :
   menus qui défilent, ou exercice (énoncé collé en haut, lignes qui défilent, clavier maths en bas). */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --ink:#18213B; --muted:#56617E; --line:#D5DCEA;
  --primary:#3446B0; --on-primary:#FFFFFF; --star:#A86A00; --star-soft:#FBEBCB;
  --good:#23746F; --good-soft:#DDF1EE; --notyet:#6B5BA8; --notyet-soft:#ECE7F8;
  --trap:#B3261E; --trap-soft:#FCE8E6; --warn:#A04A00; --warn-soft:#FDEBD8;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162A; --surface:#1A2240; --ink:#E9EDF8; --muted:#A5AECA; --line:#2E3860;
  --primary:#8E9AF2; --on-primary:#10162A; --star:#F2B24C; --star-soft:#3A3120;
  --good:#5BC0B9; --good-soft:#173A3A; --notyet:#B5A8EE; --notyet-soft:#2B2650;
  --trap:#FF8A80; --trap-soft:#3B1E1C; --warn:#FFB067; --warn-soft:#3A2814; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10162A; --surface:#1A2240; --ink:#E9EDF8; --muted:#A5AECA; --line:#2E3860;
  --primary:#8E9AF2; --on-primary:#10162A; --star:#F2B24C; --star-soft:#3A3120;
  --good:#5BC0B9; --good-soft:#173A3A; --notyet:#B5A8EE; --notyet-soft:#2B2650;
  --trap:#FF8A80; --trap-soft:#3B1E1C; --warn:#FFB067; --warn-soft:#3A2814; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.hidden{display:none!important}
svg.i{width:20px;height:20px;flex:none}

/* coque */
#coque{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);display:flex;flex-direction:column}
#barre{flex:none;display:flex;gap:8px;align-items:center;background:var(--surface);border-bottom:1.5px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
#barre .in{display:flex;gap:8px;align-items:center;max-width:760px;margin:0 auto;width:100%}
.nav{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:44px;padding:6px 12px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.nav.fort{background:var(--primary);color:var(--on-primary);border-color:var(--primary);margin-left:auto}
.nav:disabled{opacity:.45;cursor:default}
.nav:not(:disabled):hover{border-color:var(--primary)}
#app{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#focus{flex:1;min-height:0;display:flex;flex-direction:column}

/* éléments communs */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(1.3rem,5vw,1.6rem);flex:1 1 auto;min-width:0}
.pill{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;min-height:28px;display:inline-flex;align-items:center}
button.pill{min-height:44px}
.pill.warn{color:var(--notyet);border-color:var(--notyet)}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:48px;background:var(--primary);color:var(--on-primary);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:44px;padding:8px 14px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;min-height:44px;font-size:.92rem;align-self:center}
.muted{color:var(--muted)}
.sub{font-size:.95rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row label{font-size:.9rem;color:var(--muted)}
.compte{background:var(--star-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.95rem}
.compte strong{color:var(--star);font-family:var(--f-display);font-size:1.15rem}
.m{font-weight:700;font-variant-numeric:tabular-nums}
.m .c{display:inline-block;white-space:nowrap}
.mscroll{overflow-x:auto;max-width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:99;max-width:min(90vw,520px);font-size:.95rem}

/* panneaux dépliables */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:6px 16px;display:flex;flex-direction:column}
.panel[open]{padding-bottom:16px;gap:12px}
.panel.encours{border-color:var(--primary)}
.panel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::before{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:2px}
.panel[open]>summary::before{transform:rotate(45deg)}
.panel>summary h2{font-size:1.08rem;flex:1;min-width:0}
.pid{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.tag.actuel{background:var(--primary);color:var(--on-primary)}
.tag.soon{border:1px dashed var(--line);color:var(--muted)}
.tag.fait{background:var(--good-soft);color:var(--good)}
.tag.essai{background:var(--star-soft);color:var(--star)}
.parcours{display:flex;flex-direction:column;gap:8px}
.etape{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px;width:100%}
.etape:hover{border-color:var(--primary)}
.etape.suivante{border-color:var(--primary);background:var(--surface)}
.etape .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-family:var(--f-display);flex:none}
.etape.suivante .num{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.etape .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.etape small{color:var(--muted);font-size:.85rem}
.fiches{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* exercice */
.xtete{flex:none;display:flex;align-items:center;gap:10px;max-width:792px;width:100%;margin:0 auto;padding:8px 16px 0}
.xtete .titre{font-size:.85rem;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;flex:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--primary)}
.dot.now{outline:3px solid var(--primary);outline-offset:2px;background:var(--surface)}
.enonce{flex:none;background:var(--surface);border-bottom:1.5px solid var(--line);margin-top:8px}
.enonce .in{max-width:792px;margin:0 auto;padding:10px 16px}
.enonce .cons{font-size:.85rem;color:var(--muted)}
.enonce .m{font-size:clamp(1.05rem,4.7vw,1.45rem);font-family:var(--f-display);font-weight:600}
.enonce.compact .in{padding:6px 16px}
.enonce.compact .cons{display:none}
.enonce.compact .m{font-size:clamp(1rem,4.4vw,1.25rem)}
#lignes{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#lignes .in{max-width:792px;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.ligne{display:flex;flex-direction:column;gap:4px}
.etq{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.etq small{text-transform:none;letter-spacing:0;font-weight:400;font-size:.88rem;margin-left:6px}
.ligne.fait .corps{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.ligne.fait .corps .mscroll{flex:1;min-width:0}
.ligne.fait.ko .corps{border-color:var(--notyet);border-style:dashed}
.ligne.saute .corps{border-style:dashed;color:var(--muted);font-size:.9rem}
.coche{flex:none;font-weight:700;color:var(--good)}
.ligne.ko .coche{color:var(--notyet)}
.saisie{display:flex;gap:8px}
.saisie input{flex:1;min-width:0;font-family:var(--f-display);font-size:1.25rem;font-weight:500;color:var(--ink);background:var(--surface);border:2px solid var(--primary);border-radius:12px;padding:8px 12px;min-height:50px}
.outils{display:flex;gap:4px;flex-wrap:wrap}
.outils .linkbtn{padding:6px 8px;align-self:auto}
.fb{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb h3{font-size:1.05rem}
.fb.bon{background:var(--good-soft)} .fb.bon h3{color:var(--good)}
.fb.faux{background:var(--notyet-soft)} .fb.faux h3{color:var(--notyet)}
.fb.info{background:var(--star-soft)}
.fb.lecture{background:var(--surface);border:1.5px dashed var(--line)}
.fb .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.fb .regle{font-weight:700}
.modele{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.modele .pas{display:flex;flex-direction:column;gap:2px}
.modele .pas small{color:var(--muted);font-size:.85rem}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .2s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}

/* échelle d'aide : terme entouré (marche 2), ligne à trous (marche 3), ligne à recopier (marche 4) */
mark.pointe{background:transparent;color:inherit;border:2.5px solid var(--trap);border-radius:999px;padding:0 6px;font-weight:700}
.trous{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-family:var(--f-display);font-size:1.2rem;background:var(--surface);border:2px solid var(--primary);border-radius:12px;padding:6px 10px;min-height:50px}
.trous .c{white-space:pre}
.trous input.trou{font:inherit;color:var(--ink);background:var(--notyet-soft);border:2px dashed var(--notyet);border-radius:8px;min-height:44px;min-width:44px;width:4.2em;padding:2px 6px;text-align:center}
.trous input.trou[data-sorte="signe"]{width:2.2em} .trous input.trou[data-sorte="valeur"]{width:3em} .trous input.trou[data-sorte="coef"]{width:2.9em;padding:2px 2px}
.trous input.trou.ko{border-color:var(--trap);border-style:solid}
.enonce .formules{font-size:.85rem;color:var(--muted);font-family:var(--f-display);margin-top:2px;white-space:nowrap;overflow-x:auto}
.saisie .pre{font-family:var(--f-display);font-weight:600;font-size:1.2rem;white-space:nowrap;align-self:center}
.trous input.trou:focus{border-style:solid;border-color:var(--primary);outline:none}
.fb.recopie{background:var(--warn-soft)} .fb.recopie h3{color:var(--warn)}
.ligne.fait.neutre .coche{color:var(--muted)}
.bloc-barre{flex:none;width:56px;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bloc-barre i{display:block;height:100%;background:var(--good)}
.blocs{display:flex;gap:10px;justify-content:center}
.blocs i{width:18px;height:18px;border-radius:50%;border:2px solid var(--good)}
.blocs i.on{background:var(--good)}
.etape.ferme{opacity:.6}
.jl .orange{color:var(--warn);font-weight:700}

/* clavier maths */
#clavier{flex:none;background:var(--surface);border-top:1.5px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#clavier .in{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:520px;margin:0 auto}
#clavier button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:var(--f-display);font-size:1.3rem;font-weight:500;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#clavier button.op{background:var(--surface)}
.fig{display:block;width:100%;max-width:330px;margin:4px auto}
.fig text{font-family:var(--f-display),system-ui,sans-serif;font-size:15px;fill:var(--ink)}
.fig text.q{fill:var(--primary);font-weight:700;font-size:18px}
.fig text.s{font-weight:700;fill:var(--muted)}
.repere{display:block;width:100%;max-width:360px;margin:4px auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.repere .grille line{stroke:var(--line);stroke-width:1}
.repere .axes line{stroke:var(--ink);stroke-width:1.6}.repere .axes path{fill:var(--ink)}
.repere .grad text{font-family:var(--f-display),system-ui,sans-serif;font-size:12.5px;font-weight:600;fill:var(--muted)}
.repere .grad text.nomaxe{font-size:14px;font-style:italic;fill:var(--ink);font-family:Georgia,"Times New Roman",serif}
.repere .droite{stroke:var(--primary);stroke-width:2.6;stroke-linecap:round}
.repere .pt circle{fill:var(--primary)}.repere .pt text,.repere .candidat text{font-family:var(--f-display),system-ui,sans-serif;font-size:15px;font-weight:700;fill:var(--ink)}
.repere .pt.sien circle{fill:var(--muted)}
.repere .candidat circle{fill:var(--star);stroke:var(--ink);stroke-width:1.5}
.repere.actif{cursor:crosshair;border:2px solid var(--primary);border-radius:12px;background:var(--surface)}
.enonce .figure .repere{max-width:300px}
.enonce.compact .figure .repere{max-height:clamp(130px,calc(100vh - 545px),300px);max-height:clamp(130px,calc(100dvh - 545px),300px);width:auto;max-width:100%}
.placer{display:flex;flex-direction:column;align-items:center;gap:8px}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix .btn{flex:1 1 30%;min-height:48px}
.formules3{display:grid;gap:8px}
.formule{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:1.05rem;font-family:var(--f-display)}
.cote-adj{color:var(--good);font-weight:700}.cote-opp{color:var(--star);font-weight:700}.cote-hyp{color:var(--primary);font-weight:700}
ul.cotes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.corrige{display:none}.corrige.vu{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.resultat-trigo{font-weight:700;font-size:1.1rem}
#clavier button.lettre{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:1.4rem}
#clavier button.ok{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-size:1.05rem;font-weight:600}
#clavier button:active{border-color:var(--primary)}

/* leçon */
.bloc{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bloc h2{font-size:1.1rem;display:flex;align-items:center;gap:10px}
.bloc h2 .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line);font-size:.95rem;flex:none}
.idee{font-size:1.15rem}
.pas-a-pas{display:flex;flex-direction:column;gap:8px}
details.pas{background:var(--bg);border-radius:12px;padding:0 12px}
details.pas>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:700}
details.pas>summary::-webkit-details-marker{display:none}
details.pas>summary::before{content:"";width:8px;height:8px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);flex:none}
details.pas[open]>summary::before{transform:rotate(45deg)}
details.pas[open]{padding-bottom:10px}
.bloc.piege{border-color:var(--trap);background:var(--trap-soft)}
.bloc.piege h2{color:var(--trap)}
.bloc.piege h2 .num{border-color:var(--trap);background:transparent}
.fauxligne{color:var(--trap);font-weight:700}
.fauxligne .m{text-decoration:line-through;text-decoration-thickness:2px}
.fiche{background:var(--star-soft);border-radius:14px;padding:12px 14px;font-weight:700}

/* bilan */
.resultat{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.resultat .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

/* parent */
.synth{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.synth div{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.synth small{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.synth strong{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:700;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
details.seance{background:var(--bg);border-radius:12px;padding:0 12px}
details.seance>summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
details.seance>summary::-webkit-details-marker{display:none}
details.seance>summary::before{content:"";width:8px;height:8px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);flex:none}
details.seance[open]>summary::before{transform:rotate(45deg)}
details.seance[open]{padding-bottom:12px}
.seances{display:flex;flex-direction:column;gap:8px}
.tent{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.tent .meta{font-size:.85rem;color:var(--muted)}
.jl{margin:0;padding-left:22px;font-size:.92rem;display:flex;flex-direction:column;gap:2px}
.jl .ko{color:var(--notyet)}
input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;max-width:100%}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:60px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:1.5rem}
.pindots{display:flex;gap:12px;justify-content:center}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--primary)}
.pindots i.on{background:var(--primary)}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
</style>
</head>
<body>
<div id="coque">
  <header id="barre"><div class="in">
    <button class="nav" id="bRetour" onclick="retour()" aria-label="Revenir au menu précédent"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Retour</button>
    <button class="nav" id="bReprendre" onclick="reprendre()">Reprendre</button>
    <button class="nav fort" id="bSuivant" onclick="sectionSuivante()">Section suivante</button>
  </div></header>
  <main id="app"><div class="wrap"><p class="muted">Chargement…</p></div></main>

/* Une ligne de maths affichée ; une équation peut passer à la ligne juste avant le signe =. */

const tactile = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
function avecDelai(p, ms) { return Promise.race([p, new Promise((_, non) => setTimeout(() => non({ code: "unavailable" }), ms))]); }

/* ---------- état ---------- */
let S = null;                     // document suivi/app : réglages, paliers, point de reprise
let DB = null, REF = null, FILE = null;

/* Les paliers : l'élève commence à P0 ; dans la zone d'essai du parent, tous les paliers livrés sont ouverts. */
function paliersDefaut(essai) {
  const e = P.etatInitial();
  for (const id of Object.keys(e)) e[id] = PA.completerPalier(e[id]);
  if (essai) for (const id of PA.LIVRES) e[id].statut = "en_cours";
  return e;
}
function etatDefaut() {
  return { schema: 1, app: "mission-maths", creeLe: Date.now(), majLe: Date.now(), parent: { pinHash: PIN_DEFAUT }, controle: { date: null },
    eleve: { nom: "", palierActuel: "P0", reprise: null }, paliers: paliersDefaut(false), fiches: [],     // prénom : saisi par le parent, rangé dans la base, jamais dans le code
    essai: { reprise: null, paliers: paliersDefaut(true), fiches: [] } };       // les essais des appareils parent, à part de la progression de l'élève

/* Garantit que tous les champs existent, quel que soit l'âge du document lu. */
function completer(s) {
  const d = etatDefaut();
  s = s && typeof s === "object" ? clone(s) : {};
  for (const k of ["schema", "app", "creeLe", "majLe"]) if (s[k] == null) s[k] = d[k];
  s.parent = Object.assign({}, d.parent, s.parent); if (!s.parent.pinHash) s.parent.pinHash = PIN_DEFAUT;

  if (s.eleve.reprise && s.eleve.reprise.palier === "T") s.eleve.reprise = null;

    for (const id of Object.keys(defaut)) cible.paliers[id] = PA.completerPalier(Object.assign({}, defaut[id], cible.paliers[id]));

  for (const id of PA.LIVRES) if (s.essai.paliers[id].statut === "verrouille") s.essai.paliers[id].statut = "en_cours";
  if (!Array.isArray(s.fiches)) s.fiches = [];

}
/* Un appareil parent travaille dans une zone d'essai : ses exercices ne touchent pas la progression de l'élève. */
const enEssai = () => estParent();
const repriseCourante = () => enEssai() ? S.essai.reprise : S.eleve.reprise;

const fichesVues = () => enEssai() ? S.essai.fiches : S.fiches;

function marquerFait(id, section, fiche) {
  const o = clone(prog()); o[id] = PA.completerPalier(o[id]);
  if (section === "remedLecon" || section === "remed") { const r = o[id].remediation || { codes: [], fait: {} }; r.fait = Object.assign({}, r.fait, { [section]: true }); o[id].remediation = r; }
  else o[id].fait[section] = true;
  ecrirePaliers(o);
  const vues = fichesVues();
  if (fiche && !vues.includes(fiche)) ecrireApp(enEssai() ? { essai: { fiches: vues.concat([fiche]) } } : { fiches: vues.concat([fiche]) });
}

/* ---------- synchro : base Firebase (js/base.js) + file hors ligne (js/file.js) ---------- */
const stockageFile = { lire() { try { return localStorage.getItem(LF("file")); } catch (e) { return null; } }, ecrire(t) { try { localStorage.setItem(LF("file"), t); } catch (e) { /* mémoire seule */ } } };
async function envoyerOp(op) {
  if (!DB || !docConfirme) throw { code: "unavailable" };                     // on n'écrit qu'une fois la base vue
  if (navigator.onLine === false) throw { code: "unavailable" };              // hors ligne : la file garde tout, rien ne s'empile ailleurs
  try {
    if (op.chemin === RACINE && !docExiste) { await avecDelai(REF.set(clone(S)), 15000); docExiste = true; return; }
    const ref = DB.doc(op.chemin);
    await avecDelai(op.type === "set" ? ref.set(op.donnees) : ref.update(op.donnees), 15000);
    majRefus(false);
  } catch (e) {
    const code = e && e.code;
    if (code === "introuvable" && op.chemin === RACINE) { docExiste = false; throw { code: "unavailable" }; }   // document effacé : recréé en entier au prochain envoi
    if (code === "permission_denied") { majRefus(true); throw { code: "unavailable" }; }                      // l'écriture attend sur l'appareil
    if (code === "quota_exceeded") { toast("La base a atteint sa limite du jour. Ton travail est gardé ici."); throw { code: "unavailable" }; }
    throw { code: code || "unavailable" };
  }
}
/* La base refuse l'accès (lien abîmé, règles changées) : on le dit sur l'écran en cours, le travail reste sur l'appareil. */
function majRefus(v) { if (refuse === v) return; refuse = v; if (vue === "accueil" || vue === "parent") render(); else majPastille(); }
function vidage() { if (!FILE) return Promise.resolve(); return FILE.vider().then(() => { majPastille(); }); }
/* Écrit dans le document commun : appliqué tout de suite ici, envoyé dès que possible. */
function ecrireApp(donnees, cle) {
  O.fusionner(S, donnees); S.majLe = Date.now(); LS.ecrire(LF("etat"), S);
  FILE.ajouter({ id: O.uid("u"), cle: cle || null, type: "update", chemin: RACINE, donnees: Object.assign({ majLe: S.majLe }, donnees) });
  vidage();
}
function appliquerDistant(distant) {
  const neuf = clone(distant);
  for (const op of FILE.enAttente()) if (op.chemin === RACINE && op.type === "update") O.fusionner(neuf, op.donnees);   // nos écritures pas encore parties restent vraies
  S = completer(neuf); LS.ecrire(LF("etat"), S);
  if (vue === "accueil" || vue === "parent") render();      // jamais de re-dessin pendant un exercice
  else majBarre();
}
/* Firebase est chargé depuis son adresse officielle (gstatic), version fixée dans js/config.js. */
function chargerFirebase() {
  const u = n => "https://www.gstatic.com/firebasejs/" + MM.config.firebaseVersion + "/firebase-" + n + ".js";
  return Promise.all([import(u("app")), import(u("auth")), import(u("firestore"))]).then(([app, auth, firestore]) => ({ app, auth, firestore }));
}
async function initSync() {
  if (!FAM || DB || syncEnCours) return;
  syncEnCours = true;
  let fb;
  try { fb = await avecDelai(chargerFirebase(), 20000); }
  catch (e) { syncEnCours = false; mode = "horsligne"; majPastille(); return; }   // réessayé au retour du réseau, et toutes les 30 s
  DB = B.creer(fb, { config: MM.config.firebase, cle: FAM.cle, emulateur: window.__emulateur || null });
  syncEnCours = false; mode = "attente"; REF = DB.doc(RACINE);
  setTimeout(() => { if (!docConfirme) { attenteLongue = true; majPastille(); } }, 10000);
  ecouter();
}
function ecouter() {
  REF.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;                                  // écho de notre propre écriture
    if (snap.metadata.fromCache) { if (snap.exists && !docConfirme) appliquerDistant(snap.data()); return; }   // copie locale : affichable, pas fiable pour créer
    docConfirme = true; mode = "cloud"; attenteLongue = false;
    if (snap.exists) { docExiste = true; appliquerDistant(snap.data()); vidage(); }
    else { docExiste = false; creerDocument(); }
    majPastille();
  }, e => {
    if (e && e.code === "permission_denied") majRefus(true);
    else { setTimeout(ecouter, 30000); majPastille(); }                         // écoute coupée par une autre cause : on la relance
  });

    e => { if (e && e.code === "permission_denied") majRefus(true); else majPastille(); });
}

  if (n) return `<button class="pill warn" id="pastille" onclick="vidage()">${n} en attente · réessayer</button>`;
  if (mode !== "cloud") return attenteLongue || mode === "horsligne" ? '<span class="pill warn" id="pastille">Hors ligne · travail gardé ici</span>' : '<span class="pill" id="pastille">Connexion…</span>';

/* ---------- séance de travail : durée active, trous de plus de 2 minutes exclus ---------- */
let seanceEnvoyee = 0;
function activite() {
  const t = Date.now();

    if (SEANCE && SEANCE.fin > seanceEnvoyee) envoyerSeance();

/* Le palier sur lequel il travaille, parmi ceux livrés (P0 à P7). */

  if (/^G\d$/.test(palier)) return section === "methode" ? ouvrirMethode(palier) : lancerSerie(palier, section, PA.CONTENU[palier][section]);   // révision du 29/11 : ouverte d'office

/* Un triangle rectangle : X l'angle étudié (en bas à gauche), R l'angle droit (en bas à droite), Y en haut.
   methode : les côtés en couleur et nommés ; sinon, les données de l'énoncé et « ? » sur ce qu'on cherche. */
function triangleSVG(fig, methode) {
  const [X, R, Y] = fig.sommets, A = X + "\u0302", coul = { adj: "var(--good)", opp: "var(--star)", hyp: "var(--primary)" };
  const lab = methode ? { adj: "adjacent à " + A, opp: "opposé à " + A, hyp: "hypoténuse" } : fig.cotes;
  const trait = (x1, y1, x2, y2, k) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${methode ? coul[k] : "var(--ink)"}" stroke-width="${methode ? 4 : 2.5}" stroke-linecap="round"/>`;
  const txt = (x, y, t, ancre, k) => t ? `<text x="${x}" y="${y}" text-anchor="${ancre}"${t === "?" ? ' class="q"' : methode ? ` style="fill:${coul[k]};font-weight:700"` : ""}>${esc(t)}</text>` : "";
  const angle = methode ? A : fig.angle;
  return `<svg class="fig" viewBox="0 0 300 186" role="img" aria-label="Triangle ${esc(fig.sommets.join(""))} rectangle en ${esc(R)}">
    ${trait(34, 150, 226, 150, "adj")}${trait(226, 150, 226, 38, "opp")}${trait(34, 150, 226, 38, "hyp")}
    <path d="M210 150V134H226" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
    <path d="M62 150A28 28 0 0 0 58.2 135.9" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
    ${txt(130, 172, lab.adj, "middle", "adj")}${methode ? `<text x="236" y="92" style="fill:${coul.opp};font-weight:700">opposé<tspan x="236" dy="18">à ${esc(A)}</tspan></text>` : txt(236, 100, lab.opp, "start", "opp")}${txt(122, 82, lab.hyp, "end", "hyp")}
    ${angle ? `<text x="70" y="143"${angle === "?" ? ' class="q"' : ""}>${esc(angle)}</text>` : ""}
    <text x="20" y="166" class="s">${esc(X)}</text><text x="234" y="166" class="s">${esc(R)}</text><text x="234" y="34" class="s">${esc(Y)}</text></svg>`;
}

async function chargerLecon(id) {
  if (LECONS[id]) return LECONS[id];
  let pack = null;
  try { const idx = await (await fetch("lecons/index.json?v=" + APP_VERSION)).json(); const m = idx.lecons.find(x => x.pack_id === id); pack = await (await fetch(m.fichier + "?v=" + APP_VERSION)).json(); LS.ecrire("mm.lecon." + id, pack); }
  catch (e) { pack = LS.lire("mm.lecon." + id); }                             // hors ligne : dernière copie lue
  if (!pack) throw new Error("leçon introuvable");
  const defauts = L.valider(pack);
  if (defauts.length) throw new Error("leçon refusée : " + defauts[0]);
  memoriserFiche(pack.lecon.fiche);

  return (LECONS[id] = pack);
}

    } catch (e) { /* hors ligne : on montre la dernière lecture */ }
  }
  RAPPORT = { seances: parId(distant.seances, local.seances), tentatives: parId(distant.tentatives, local.tentatives), lu: Date.now(), frais };
  if (vue === "parent") render();
}
const dateCourte = t => new Date(t).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function renderParent() {
  const p = k => `data-k="${k}"${ouverts.has(k) ? " open" : ""}`;
  const rap = RAPPORT, maintenant = Date.now();
  const r = rap ? R.resume(rap.seances, rap.tentatives, maintenant) : null;
  const quand = j => j === 0 ? "aujourd'hui" : j === 1 ? "hier" : "il y a " + j + " jours";
  const synth = !r ? '<p class="muted">Lecture du suivi…</p>' : `<div class="synth">
      <div><small>Dernière séance</small><strong>${r.derniere ? quand(r.joursSansSeance) + " · " + R.texteDuree(r.derniere.dureeActive || 0) : "aucune"}</strong></div>
      <div><small>7 derniers jours</small><strong>${r.minutes7j} min · ${pluriel(r.seances7j, "séance")}</strong></div>
      <div><small>Exercices (7 jours)</small><strong>${r.exercices7j ? r.justes7j + " sur " + r.exercices7j + " sans erreur" : "aucun"}</strong></div>
      <div><small>Palier actuel</small><strong>${esc((() => { const id = P.palierActuel(S.paliers), q = P.PALIERS.find(x => x.id === id); return (id === "FINAL" ? "Final" : id) + " · " + q.nom; })())}</strong></div></div>`;
  /* D39 : chaque ligne acceptée dit le niveau d'aide atteint, en clair ; « recopiée » en orange. */
  const aideTexte = l => l.niveau != null ? A.NIVEAUX[l.niveau] : l.donnee ? A.NIVEAUX[4] : l.saute ? "étape faite dans la ligne d'avant" : l.incomplet ? "juste, étape en cours" : "juste";
  const ligneJ = l => l.saute && !l.saisie ? "" : `<li class="${l.juste === false ? "ko" : (l.niveau === 4 || l.donnee) ? "orange" : ""}">${maths(l.saisie || "")} ${l.juste === false ? "✗ " + esc(l.precision || (l.code && D.CATALOGUE[l.code] ? D.CATALOGUE[l.code].nom : l.statut === "incomplet" ? "étape pas finie" : "erreur non reconnue")) + (l.marche ? " · " + ["", "explication", "explication", "indice", "ligne à trous", "ligne montrée"][l.marche] : "") : "✓ " + esc(aideTexte(l))}</li>`;
  const nomTent = t => (t.jumeau ? "Jumeau" : PA.NOMS[t.section] || NOMS_MODE[t.mode] || t.mode || "") + (t.palier && t.palier !== "T" ? " · " + t.palier : "");
  const tentH = t => `<div class="tent"><div class="mscroll">${maths(t.enonce || "")}</div>
      <span class="meta">${esc(nomTent(t))} · ${R.texteDuree(t.tempsMs || 0)} · ${t.total != null ? t.points + " sur " + t.total : t.juste ? "sans erreur" : t.nbErreurs ? pluriel(t.nbErreurs, "erreur") : "avec aide"}${t.aideMax ? " · aide max : " + A.NIVEAUX[t.aideMax] : t.aideUtilisee ? " · aide utilisée" : ""}${t.resultatJuste === false ? " · résultat faux" : ""}</span>
      <ol class="jl">${(t.lignes || []).map(ligneJ).join("")}</ol></div>`;
  const seances = rap ? R.parSeance(rap.seances, rap.tentatives) : [];
  const seanceH = s => `<details class="seance"><summary><strong>${esc(dateCourte(s.debut))}</strong><span>${R.texteDuree(s.dureeActive || 0)} actives · ${pluriel(s.tentatives.length, "exercice")}</span>${s.parent ? '<span class="tag essai">Essai parent</span>' : ""}</summary>
      ${s.tentatives.length ? s.tentatives.map(tentH).join("") : '<p class="note">Aucun exercice terminé pendant cette séance.</p>'}</details>`;
  const erreurs = r && r.erreurs7j.length ? `<div class="tablewrap"><table><thead><tr><th>Erreur</th><th>Code</th><th>Fois</th></tr></thead><tbody>${r.erreurs7j.map(e => `<tr><td>${esc(D.CATALOGUE[e.code] ? D.CATALOGUE[e.code].nom : e.code)}<br><span class="note">${esc(D.CATALOGUE[e.code] ? D.CATALOGUE[e.code].exemple : "")}</span></td><td>${esc(e.code)}</td><td>${e.n}</td></tr>`).join("")}</tbody></table></div>` : '<p class="muted">Aucune erreur enregistrée sur les 7 derniers jours.</p>';
  const etapesFaites = (id, p) => PA.sections(id, p).filter(x => x.fait).map(x => PA.NOMS[x.id].toLowerCase()).join(", ");
  const paliers = `<div class="tablewrap"><table><thead><tr><th>Palier</th><th>Statut</th><th>Meilleur examen</th></tr></thead><tbody>
      ${P.PALIERS.map(q => { const p = PA.completerPalier(S.paliers[q.id]), livre = PA.LIVRES.includes(q.id);
        return `<tr><td>${q.id === "FINAL" ? "Final" : q.id} · ${esc(q.nom)}</td><td>${esc(P.STATUTS[p.statut])}${p.parDiagnostic ? " (par le diagnostic)" : ""}${PA.LECONS_SEULES.includes(q.id) && p.fait.lecon ? '<br><span class="note">Leçon lue</span>' : ""}${livre ? (etapesFaites(q.id, p) ? `<br><span class="note">Fait : ${esc(etapesFaites(q.id, p))}</span>` : "") + (p.remediation ? `<br><span class="note">Remédiation : ${esc(p.remediation.codes.map(c => D.CATALOGUE[c] ? D.CATALOGUE[c].nom : c).join(", ") || "pas à pas")}</span>` : "") : ' <span class="note">(contenu à venir)</span>'}</td><td>${p.meilleurExamen == null ? "—" : p.meilleurExamen + " %"}${p.examens ? `<br><span class="note">${pluriel(p.examens, "examen")}</span>` : ""}</td></tr>`; }).join("")}</tbody></table></div>`;
  const nAtt = FILE.taille(), nRej = FILE.rejets().length;
  $("#app").innerHTML = `<div class="wrap">
    <div class="top"><h1>Espace parent</h1>${pastille()}</div>
    ${synth}
    <div class="row"><button class="btn ghost small" onclick="plier(true)">Tout déplier</button><button class="btn ghost small" onclick="plier(false)">Tout replier</button>
      <button class="btn ghost small" onclick="chargerRapport()">Actualiser</button><span class="note">${rap ? (rap.frais ? "Lu à " : "Dernière lecture connue, affichée à ") + new Date(rap.lu).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : ""}</span></div>
    <details class="panel" ${p("seances")}><summary><h2>Séances</h2><span class="tag soon">${seances.length}</span></summary>
      ${seances.length ? `<div class="seances">${seances.map(seanceH).join("")}</div>` : '<p class="muted">Aucune séance pour l\'instant.</p>'}
      ${r && r.essaisParent ? `<p class="note">Les ${r.essaisParent} séance(s) « Essai parent » viennent de ton compte et ne comptent pas dans les chiffres du haut.</p>` : ""}</details>
    <details class="panel" ${p("erreurs")}><summary><h2>Erreurs des 7 derniers jours</h2></summary>${erreurs}</details>
    <details class="panel" ${p("paliers")}><summary><h2>Paliers</h2></summary>${paliers}</details>
    <details class="panel" ${p("reglages")}><summary><h2>Réglages</h2></summary>
      <div class="row"><label for="nom">Prénom de l'élève</label><input type="text" id="nom" value="${esc(S.eleve.nom)}" maxlength="24"><button class="btn small" onclick="reglerNom()">Enregistrer</button></div>
      <div class="row"><label for="dctl">Date du prochain contrôle</label><input type="date" id="dctl" value="${esc(S.controle.date || "")}"><button class="btn small" onclick="reglerDate()">Enregistrer</button>${S.controle.date ? '<button class="btn ghost small" onclick="effacerDate()">Effacer</button>' : ""}</div>
      <div class="row"><button class="btn ghost small" onclick="changerCode()">Changer le code parent</button></div></details>
    <details class="panel" ${p("liens")}><summary><h2>Liens et synchronisation</h2></summary>
      <p><strong>Lien élève</strong> : à ouvrir une fois sur son téléphone et une fois sur son PC.</p>
      <div class="row"><input type="text" id="lienEleve" readonly value="${esc(B.lien(location.href, FAM.cle, "eleve"))}" aria-label="Lien élève"><button class="btn small" onclick="copierLien('lienEleve')">Copier le lien élève</button></div>
      <p class="note">N'ouvre pas ce lien sur tes appareils : tes essais compteraient comme les siens.</p>
      <p><strong>Lien parent</strong> : pour tes autres appareils. Tes essais y restent à part.</p>
      <div class="row"><input type="text" id="lienParent" readonly value="${esc(B.lien(location.href, FAM.cle, "parent"))}" aria-label="Lien parent"><button class="btn ghost small" onclick="copierLien('lienParent')">Copier le lien parent</button></div>
      <p class="note">Ces liens sont la clé de la famille : qui les a voit et modifie la progression. Envoie-les seulement à ton fils et à toi.</p>
      <p>Cet appareil : <strong>${estParent() ? "parent" : "élève"}</strong>. ${refuse ? "La base refuse l'accès : rouvre le bon lien." : mode === "cloud" ? "Le suivi commun est joint et à jour." : mode === "horsligne" || attenteLongue ? "Hors ligne : le travail reste sur l'appareil." : "Connexion au suivi commun en cours."}</p>
      <p class="sub">${nAtt ? pluriel(nAtt, "écriture") + " en attente d'envoi." : "Aucune écriture en attente."} ${nRej ? pluriel(nRej, "écriture") + " refusée" + (nRej > 1 ? "s" : "") + " par la base." : ""}</p>
      <div class="row">${nAtt ? '<button class="btn ghost small" onclick="vidage().then(render)">Envoyer maintenant</button>' : ""}${nRej ? '<button class="btn ghost small" onclick="FILE.reprendreRejets();vidage().then(render)">Renvoyer les écritures refusées</button>' : ""}</div></details>
    <button class="linkbtn" onclick="quitterParent()">Quitter l'espace parent</button></div>`;
  suivrePanneaux();
}
function copierLien(id) {
  const el = $("#" + id), ok = () => toast("Lien copié. Colle-le dans un message.");
  el.select();
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(ok, () => { try { document.execCommand("copy"); ok(); } catch (e) { toast("Copie impossible : sélectionne le lien à la main."); } });
  else { try { document.execCommand("copy"); ok(); } catch (e) { toast("Copie impossible : sélectionne le lien à la main."); } }
}
function reglerNom() { const v = $("#nom").value.trim(); if (!v) return; ecrireApp({ eleve: { nom: v } }); toast("Prénom enregistré."); render(); }
function reglerDate() { const v = $("#dctl").value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Choisis une date dans le calendrier."); return; } ecrireApp({ controle: { date: v } }); toast("Date du contrôle enregistrée."); render(); }
function effacerDate() { ecrireApp({ controle: { date: null } }); toast("Date effacée."); render(); }

/* ---------- hauteur réellement visible (si un clavier natif s'ouvre malgré tout) ---------- */
function majVue() {
  const v = window.visualViewport; if (!v) return;
  document.documentElement.style.setProperty("--vvh", v.height + "px");
  document.documentElement.style.setProperty("--vvt", v.offsetTop + "px");
  if (vue === "exo") cadrer();
}
if (window.visualViewport) { visualViewport.addEventListener("resize", majVue); visualViewport.addEventListener("scroll", majVue); }
window.addEventListener("online", () => { if (FAM && !DB) initSync(); vidage(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") quitterPage(); else vidage(); });
window.addEventListener("pagehide", quitterPage);
setInterval(() => { if (FAM && !DB) initSync(); if (FILE && FILE.taille()) vidage(); }, 30000);
/* Un autre lien collé dans le même onglet : on recharge pour repartir proprement avec cette clé et ce rôle. */
window.addEventListener("hashchange", () => { const f = B.lireLien(location.hash); if (f && (!FAM || f.cle !== FAM.cle || f.role !== FAM.role)) location.reload(); });

/* ---------- démarrage : l'app s'affiche tout de suite avec la dernière copie connue, la base arrive ensuite ---------- */
async function demarrerFamille(initial) {
  S = completer(initial || LS.lire(LF("etat")) || etatDefaut());
  SEANCE = LS.lire(LF("seance"));
  FILE = MM.file.creerFile(stockageFile, envoyerOp);
  for (const op of FILE.enAttente()) if (op.chemin === RACINE && op.type === "update") O.fusionner(S, op.donnees);
  S = completer(S); LS.ecrire(LF("etat"), S);
  if (vue === "appairage" || vue === "pin") vue = "accueil";
  render();
  Promise.all(PA.LIVRES.concat(PA.LECONS_SEULES).filter(id => PA.CONTENU[id].lecon).map(id => chargerLecon(PA.CONTENU[id].lecon).catch(() => null))).then(() => { if (vue === "accueil") render(); });
  await initSync();
  if (vue === "accueil" || vue === "parent") render(); else majPastille();
}
(function demarrer() {
  majVue();
  if (FAM) demarrerFamille(); else render();
})();
</script>
